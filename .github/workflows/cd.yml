name: CD

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  DEPLOY_PATH: /home/ubuntu/bill-splitter-deployment/bill-splitter

jobs:
  version:
    name: Version release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag_version.outputs.new_tag }}
      release_version: ${{ steps.tag_version.outputs.new_version }}
      source_tag: ${{ steps.target.outputs.source_tag }}
      target_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve master image tag
        id: target
        run: |
          target_sha="$(git rev-parse HEAD)"
          echo "source_tag=${target_sha::7}" >> "$GITHUB_OUTPUT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: master
          commit_sha: ${{ steps.target.outputs.sha }}
          fetch_all_tags: true
          default_bump: patch

      - name: Create GitHub release
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          target_commitish: ${{ steps.target.outputs.sha }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

      - name: Retag backend image for release
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        run: >
          docker buildx imagetools create
          --tag "${REGISTRY}/${IMAGE_NAMESPACE}/backend:${{ steps.tag_version.outputs.new_tag }}"
          "${REGISTRY}/${IMAGE_NAMESPACE}/backend:${{ steps.target.outputs.source_tag }}"

      - name: Retag frontend image for release
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        run: >
          docker buildx imagetools create
          --tag "${REGISTRY}/${IMAGE_NAMESPACE}/frontend:${{ steps.tag_version.outputs.new_tag }}"
          "${REGISTRY}/${IMAGE_NAMESPACE}/frontend:${{ steps.target.outputs.source_tag }}"

  release:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: version
    if: ${{ needs.version.outputs.release_tag != '' }}
    environment:
      name: production
      url: ${{ vars.URL }}

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          port: ${{ secrets.VM_PORT || '22' }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: RELEASE_TAG,DEPLOY_PATH
          script: |
            set -euo pipefail

            cd "$DEPLOY_PATH"
            git pull --ff-only origin master

            IMAGE_TAG="$RELEASE_TAG" docker compose pull
            IMAGE_TAG="$RELEASE_TAG" docker compose up -d --no-build --remove-orphans
            docker compose ps

            curl --fail --show-error --silent --retry 5 --retry-delay 5 http://localhost:8000/api/v1/health/

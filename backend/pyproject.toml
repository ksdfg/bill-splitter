[project]
name = "bill-splitter"
version = "0.1.0"
description = "A small utility to split bills amongst friends"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Kshitish Deshpande", email = "me@ksdfg.dev" }
]

dependencies = [
    "fastapi[all]>=0.139.0",
    "litellm==1.92.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]

[tool.ruff]
line-length = 120
exclude = ["__init__.py"]

[tool.pytest.ini_options]
pythonpath = "."
